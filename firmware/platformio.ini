; AgroBits firmware — ESP32-C3 SuperMini
; Versiones de librerías fijadas. Cambiarlas exige revisar el README.

[platformio]
; Sin esto, `pio run -t upload` procesa TODOS los entornos y el último en flashearse
; es el de calibración, dejando la placa sin WiFi ni portal.
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 4 MB de flash sin SPIFFS: app de 3 MB en vez de 1,3 MB (con la tabla por defecto el uso era del 94 %).
board_build.partitions = huge_app.csv
; USB-CDC del C3 SuperMini: el C3 no tiene TinyUSB, usa el periférico USB Serial/JTAG.
; ARDUINO_USB_MODE=1 selecciona HWCDC (Serial = HWCDCSerial); sin él el core busca USBSerial y no compila.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    bblanchon/ArduinoJson@7.2.0

; Calibración del LDR: no arranca WiFi/NTP/portal; imprime CSV por serie (ver README).
[env:calibracion]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DAGROBITS_CALIBRACION_LDR=1
